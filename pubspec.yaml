name: jahiz
description: Ready-made iOS and Android shopping apps.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.6.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Bloc for state management
  bloc: ^9.0.1
  flutter_bloc: ^9.1.1
  # Functional programming things
  dartz: ^0.10.1
  # Value equality
  equatable: ^2.0.5
  # Service locator
  get_it: ^8.2.0
  # Remote API
  dio: ^5.4.3+1
  internet_connection_checker: ^3.0.1
  #Locale storage
  shared_preferences: ^2.2.3
  # App router
  auto_route: ^10.1.2
  # Localization
  intl: ^0.20.2
  #Views
  carousel_slider: ^5.1.1
  dots_indicator: ^4.0.1
  flutter_staggered_grid_view: ^0.7.0
  sliver_tools: ^0.2.12
  flutter_native_splash: ^2.4.0
  fluttertoast: ^9.0.0
  # awesome_dialog: ^3.2.1
  toggle_switch: ^2.3.0
  #Images
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  #Validators
  queen_validators: ^1.0.1
  #Maps
  google_maps_flutter: ^2.6.1
  pull_to_refresh: ^2.0.0
  #Payment
  myfatoorah_flutter: ^3.0.11
  #Share
  share_plus: ^12.0.0
  #Url launcher
  url_launcher: ^6.2.6
  #Info
  package_info_plus: ^8.0.0
  #Firebase
  fcm_config: 
    path: local_packages/fcm_config
  #Restart app
  flutter_phoenix: ^1.1.1
  #Crashlytics
  firebase_crashlytics: ^4.2.0
  geolocator: ^14.0.2
  # flutter_vibrate: ^1.3.0
  badges: ^3.1.2
  intl_utils: ^2.8.11
  # rive: ^0.13.20
  # rive_common: ^0.4.15


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  auto_route_generator: ^10.2.4
  flutter_native_splash: ^2.4.4
  build_runner: ^2.4.9
  flutter_gen_runner: ^5.4.0
  mocktail: ^1.0.3
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/jahez_logo.png"

flutter_gen:
  output: lib/core/gen/
  integrations:
    flutter_svg: true

flutter:

  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
  - family: Qatar
    fonts:
      - asset: assets/fonts/qatar/Qatar2022Arabic-Thin.ttf
        weight: 100
      - asset: assets/fonts/qatar/Qatar2022Arabic-Book.ttf
        weight: 400
      - asset: assets/fonts/qatar/Qatar2022Arabic-Medium.ttf
        weight: 500
      - asset: assets/fonts/qatar/Qatar2022Arabic-Bold.ttf
        weight: 700
      - asset: assets/fonts/qatar/Qatar2022Arabic-Heavy.ttf
        weight: 800

flutter_intl:
  enabled: true

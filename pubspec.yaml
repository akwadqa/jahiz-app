name: jahiz
description: Ready-made iOS and Android shopping apps.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Bloc for state management
  bloc: ^8.1.2
  flutter_bloc: ^8.1.3
  # Functional programming things
  dartz: ^0.10.1
  # Value equality
  equatable: ^2.0.5
  # Service locator
  get_it: ^7.6.4
  # Remote API
  dio: ^5.3.3
  internet_connection_checker: ^1.0.0+1
  #Locale storage
  shared_preferences: ^2.2.1
  # App router
  auto_route: ^7.8.4
  # Localization
  intl: ^0.18.1
  #Views
  carousel_slider: ^4.2.1
  dots_indicator: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  sliver_tools: ^0.2.12
  flutter_native_splash: ^2.3.3
  fluttertoast: ^8.2.4
  awesome_dialog: ^3.1.0
  toggle_switch: ^2.1.0
  #Images
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.7
  #Validators
  queen_validators: ^1.0.1
  #Maps
  google_maps_flutter: ^2.5.0
  pull_to_refresh: ^2.0.0
  #Payment
  myfatoorah_flutter: ^3.0.3
  #Share
  share_plus: ^7.2.1
  #Url launcher
  url_launcher: ^6.1.14
  #Info
  package_info_plus: ^4.2.0
  #Firebase
  fcm_config: 
    path: local_packages/fcm_config
  #Restart app
  flutter_phoenix: ^1.1.1
  #Crashlytics
  firebase_crashlytics: ^3.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.3

  auto_route_generator: ^7.3.2
  build_runner: ^2.4.6
  flutter_gen_runner: ^5.3.2

flutter_gen:
  output: lib/core/gen/
  integrations:
    flutter_svg: true

flutter:

  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
  - family: Qatar
    fonts:
      - asset: assets/fonts/qatar/Qatar2022Arabic-Thin.ttf
        weight: 100
      - asset: assets/fonts/qatar/Qatar2022Arabic-Book.ttf
        weight: 400
      - asset: assets/fonts/qatar/Qatar2022Arabic-Medium.ttf
        weight: 500
      - asset: assets/fonts/qatar/Qatar2022Arabic-Bold.ttf
        weight: 700
      - asset: assets/fonts/qatar/Qatar2022Arabic-Heavy.ttf
        weight: 800

flutter_intl:
  enabled: true

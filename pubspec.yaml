name: jahiz
description: Ready-made iOS and Android shopping apps.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Bloc for state management
  bloc: ^8.1.4
  flutter_bloc: ^8.1.5
  # Functional programming things
  dartz: ^0.10.1
  # Value equality
  equatable: ^2.0.5
  # Service locator
  get_it: ^7.7.0
  # Remote API
  dio: ^5.4.3+1
  internet_connection_checker: ^1.0.0+1
  #Locale storage
  shared_preferences: ^2.2.3
  # App router
  auto_route: ^8.1.3
  # Localization
  intl: ^0.18.1
  #Views
  carousel_slider: ^4.2.1
  dots_indicator: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  sliver_tools: ^0.2.12
  flutter_native_splash: ^2.4.0
  fluttertoast: ^8.2.5
  awesome_dialog: ^3.2.1
  toggle_switch: ^2.3.0
  #Images
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  #Validators
  queen_validators: ^1.0.1
  #Maps
  google_maps_flutter: ^2.6.1
  pull_to_refresh: ^2.0.0
  #Payment
  myfatoorah_flutter: ^3.0.11
  #Share
  share_plus: ^9.0.0
  #Url launcher
  url_launcher: ^6.2.6
  #Info
  package_info_plus: ^8.0.0
  #Firebase
  fcm_config: 
    path: local_packages/fcm_config
  #Restart app
  flutter_phoenix: ^1.1.1
  #Crashlytics
  firebase_crashlytics: ^3.5.4
  geolocator: ^11.0.0
  flutter_vibrate: ^1.3.0
  badges: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.2

  auto_route_generator: ^8.0.0
  build_runner: ^2.4.9
  flutter_gen_runner: ^5.4.0
  mocktail: ^1.0.3
  bloc_test: ^9.1.7
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/images/GP Logo APP.png"

flutter_gen:
  output: lib/core/gen/
  integrations:
    flutter_svg: true

flutter:

  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
  - family: Qatar
    fonts:
      - asset: assets/fonts/qatar/Qatar2022Arabic-Thin.ttf
        weight: 100
      - asset: assets/fonts/qatar/Qatar2022Arabic-Book.ttf
        weight: 400
      - asset: assets/fonts/qatar/Qatar2022Arabic-Medium.ttf
        weight: 500
      - asset: assets/fonts/qatar/Qatar2022Arabic-Bold.ttf
        weight: 700
      - asset: assets/fonts/qatar/Qatar2022Arabic-Heavy.ttf
        weight: 800

flutter_intl:
  enabled: true
